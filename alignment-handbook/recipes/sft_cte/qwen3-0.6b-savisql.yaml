# CUDA_VISIBLE_DEVICES=1  ACCELERATE_LOG_LEVEL=info accelerate launch --main_process_port 29604 --config_file recipes/accelerate_configs/deepspeed_zero3.yaml  scripts/sft.py  --config  recipes/sft_cte/qwen3-0.6b-savisql.yaml

